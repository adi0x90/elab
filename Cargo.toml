[workspace]
resolver = "2"
members = [
  "crates/elab-core",
  "crates/elab-gdb",
  "crates/elab-probe",
  "crates/elab-serial",
  "crates/elab-cli",
]

default-members = ["crates/elab-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
serialport = { version = "4", default-features = false }
regex = "1"
