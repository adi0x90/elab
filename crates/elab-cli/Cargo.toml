[package]
name = "elab-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "elab"
path = "src/main.rs"

[features]
probe = ["dep:elab-probe"]

[dependencies]
elab-probe = { path = "../elab-probe", optional = true }
elab-core = { path = "../elab-core" }
elab-gdb = { path = "../elab-gdb" }
elab-serial = { path = "../elab-serial" }
clap.workspace = true
serde_json.workspace = true
