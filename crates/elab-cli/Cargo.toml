[package]
name = "elab"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Phased experiments against embedded targets: GDB/MI, probe-rs, serial, and JSONL evidence."

[[bin]]
name = "elab"
path = "src/main.rs"

[features]
probe = ["dep:elab-probe"]

[dependencies]
elab-probe = { path = "../elab-probe", version = "0.1.0", optional = true }
elab-core = { path = "../elab-core", version = "0.1.0" }
elab-gdb = { path = "../elab-gdb", version = "0.1.0" }
elab-serial = { path = "../elab-serial", version = "0.1.0" }
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
